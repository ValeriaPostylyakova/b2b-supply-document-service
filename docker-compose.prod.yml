x-common-env: &common-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  DEBUG: "false"
  DB_HOST: documents-db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-documents_db}
  DB_USER: ${DB_USER:-documents_user}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DRF_CORE_URL: ${DRF_CORE_URL:-http://django-server:8000}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-core_rabbitmq_broker}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  REDIS_HOST: ${REDIS_HOST:-core_redis_broker}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: "2"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  S3_KEY_ID: ${S3_KEY_ID:?Set S3_KEY_ID in .env}
  S3_SECRET: ${S3_SECRET:?Set S3_SECRET in .env}
  S3_INTERNAL_URL: ${S3_INTERNAL_URL:-http://minio:9000}
  S3_EXTERNAL_URL: ${S3_EXTERNAL_URL:?Set S3_EXTERNAL_URL in .env}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-b2b-supply-core-private}
  QUEUE_NAME: ${QUEUE_NAME:-documents.events}

x-documents-common: &documents-common
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  environment: *common-env
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - default
    - shared_rabbitmq_net
  restart: unless-stopped

services:
  documents-migrations:
    <<: *documents-common
    restart: "no"
    command: alembic upgrade head
    depends_on:
      documents-db:
        condition: service_healthy

  documents-service:
    <<: *documents-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "127.0.0.1:${DOCUMENTS_PORT:-8002}:8000"
    depends_on:
      documents-migrations:
        condition: service_completed_successfully

  documents-consumer:
    <<: *documents-common
    command: python -u -m app.consumer
    depends_on:
      documents-migrations:
        condition: service_completed_successfully

  documents-worker:
    <<: *documents-common
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=500
    depends_on:
      documents-migrations:
        condition: service_completed_successfully

  documents-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-documents_db}
      POSTGRES_USER: ${DB_USER:-documents_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5435}:5432"
    volumes:
      - documents_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-documents_user} -d ${DB_NAME:-documents_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
    restart: unless-stopped

volumes:
  documents_db_data:

networks:
  default:
  shared_rabbitmq_net:
    external: true
