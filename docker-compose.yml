x-common-env: &common-env
  PYTHONPATH: /app
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  RABBITMQ_HOST: core_rabbitmq_broker
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: core_redis_broker
  REDIS_PORT: 6379
  REDIS_DB: 2

x-documents-common: &documents-common
  build: .
  working_dir: /app
  environment: *common-env
  volumes:
    - ./app:/app/app
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini
  depends_on:
    - documents-db
  networks:
    - default
    - shared_rabbitmq_net

services:
  documents-service:
    <<: *documents-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"

  documents-consumer:
    <<: *documents-common
    command: uv run python -u -m app.consumer
    restart: unless-stopped

  documents-worker:
    <<: *documents-common
    environment:
      <<: *common-env
      REDIS_DB: 1
    volumes:
      - ./app:/app/app
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info
    restart: unless-stopped

  documents-db:
    image: postgres:16-alpine
    container_name: documents-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - documents_db_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  documents_db_data:

networks:
  default:
  shared_rabbitmq_net:
    external: true
